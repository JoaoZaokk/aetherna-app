name: Problema / Bug / Fehler / 問題 / 问题
description: Algo não funciona no app. / Something in the app doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Não coloque dados pessoais aqui: a issue é pública. / Do not post personal data: issues are public."
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu? / What happened?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir / Steps to reproduce
  - type: input
    id: versao
    attributes:
      label: Versão do app e do iOS / App and iOS version
      placeholder: "Ætherna 1.0, iOS 18.2, iPhone 15"
